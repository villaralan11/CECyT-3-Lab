<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/fisica">
<title>Catálogo de Física · CECyT-3 Lab</title>
<style>
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .card {
    max-width: 420px;
    padding: 40px 32px;
    text-align: center;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 18px 50px -22px rgba(0,0,0,.22);
  }
  .dot {
    width: 40px; height: 40px; margin: 0 auto 16px;
    border-radius: 12px;
    background: linear-gradient(145deg, #10b981, #0d9488);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.82); opacity: .6; } }
  h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.02em; }
  p { margin: 0 0 18px; font-size: 13.5px; line-height: 1.55; color: #6e6e73; }
  a {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #0d9488);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main class="card">
  <div class="dot" aria-hidden="true"></div>
  <h1>Yendo al catálogo de Física…</h1>
  <p>«Mis Simuladores» ya no existe como página aparte: todos los simuladores viven ahora en el catálogo principal de Física.</p>
  <a href="/fisica">Abrir el catálogo de Física</a>
</main>
<script>try { location.replace('/fisica'); } catch (e) {}</script>
</body>
</html>
